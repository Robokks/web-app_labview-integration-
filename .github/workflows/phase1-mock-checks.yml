name: Phase 1 Mock Checks
on:
  pull_request:
  push:
    branches:
      - feature/phase1-mock-designer

permissions:
  contents: read

jobs:
  mock-contract-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install developer dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium for in-memory UI tests
        run: python -m playwright install --with-deps chromium
      - name: Compile and check JavaScript
        run: |
          python -m compileall -q gateway tests
          node --check web/app.js
          node --check hosted-demo/app.js
          node --check hosted-demo/templates.js
          node --check hosted-demo/demo-mock.js
      - name: Run mock-only contract and browser tests
        run: python -m pytest -q tests/test_gateway.py tests/test_browser.py hosted-demo/tests/test_operator.py
      - name: Test hosted rig templates in in-memory Chromium
        run: python -m pytest -q tests/test_templates.py
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanners
        run: python -m pip install bandit pip-audit
      - name: Python static security checks
        run: bandit -q -r gateway
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements-dev.txt
